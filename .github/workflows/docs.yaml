---
name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yaml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v7

      - name: Install docs dependencies
        working-directory: docs
        run: |
          uv venv .venv
          uv pip install sphinx sphinx-autobuild \
            myst_parser sphinxcontrib.mermaid shibuya \
            sphinx-design sphinx-copybutton

      # reference/changelog.md only includes CHANGES.md, which carries the H1.
      - name: Check prose
        working-directory: docs
        run: bash check-prose.sh $(find sources -name '*.md' -not -path '*/specs/*' -not -name changelog.md)

      - name: Build documentation
        working-directory: docs
        run: .venv/bin/sphinx-build -W --keep-going sources html

      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/html

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
