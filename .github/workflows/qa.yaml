---
name: QA

on:
  workflow_call:

permissions:
  contents: read

env:
  # Keep in sync with the ruff-pre-commit rev in .pre-commit-config.yaml.
  # Unpinned, every ruff release changed CI behavior on PRs that touched
  # nothing related. Bump deliberately, one small PR per ruff minor.
  RUFF_VERSION: "0.16.7"

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Run ruff check
        run: uvx ruff@${{ env.RUFF_VERSION }} check .

      - name: Run ruff format check
        run: uvx ruff@${{ env.RUFF_VERSION }} format --check .
